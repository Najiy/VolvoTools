[package]
name = "volvo-core"
version = "0.1.0"
description = "Backend logic for the VolvoTools UI: flasher bridge, backup library and safety gates"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
