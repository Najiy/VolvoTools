[package]
name = "volvoui"
version = "0.1.0"
description = "Desktop UI for backing up and flashing ECUs through VolvoFlasher"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "volvoui_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
volvo-core = { path = "../crates/volvo-core" }
